<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIO-RADAR · Runway Wildlife Prevention</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111d;color:#eaf4ff;font-family:Arial,sans-serif}#m{text-align:center;padding:32px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#55d7ff;margin:0 4px;animation:p 1s infinite alternate}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes p{to{opacity:.2;transform:translateY(-5px)}}</style></head><body><div id="m"><h2>Loading BIO-RADAR</h2><p><span class="dot"></span><span class="dot"></span><span class="dot"></span></p></div><script>(async()=>{try{const files=['bundle/a.txt','bundle/c1.txt','bundle/c2.txt','bundle/b.txt'];let s='';for(const f of files){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);s+=await r.text()}const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('m').innerHTML='<h2>Unable to load BIO-RADAR</h2><p>'+e.message+'</p>'}})();</script></body></html>
